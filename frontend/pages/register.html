<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد | الصيدلية الذكية SP</title>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="../assets/css/style.css?v=4.0">
    <link rel="stylesheet" href="../assets/css/chatbot-widget.css?v=4.0">
</head>
<body>
    <nav class="navbar"></nav>

    <div class="container" style="max-width: 440px; margin-top: 3.5rem;">
        <div class="card">
            <div style="text-align: center; margin-bottom: 1.25rem;">
                <h2 style="font-size: 1.3rem; color: var(--primary); margin-bottom: 0.25rem;">تسجيل حساب كادر جديد</h2>
                <p style="color: var(--text-muted); font-size: 0.88rem;">أدخل البيانات المطلوبة لإنشاء حساب معتمد</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="regUsername" class="form-control" placeholder="الاسم الوظيفي الكامل" required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني المؤسسي</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="user@hospital.local" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>الدور الوظيفي والصلاحية</label>
                    <select id="regRole" class="form-control" required>
                        <option value="staff">صيدلي (كاشير وصرف فواتير)</option>
                        <option value="supervisor">مدير الصيدلية (إدارة المخزون والموردين)</option>
                    </select>
                </div>
                <button type="submit" id="regBtn" class="btn" style="width: 100%; padding: 0.65rem; font-size: 0.95rem;">إنشاء الحساب</button>
            </form>

            <div id="regMsg" style="margin-top: 1rem; text-align: center; font-size: 0.88rem;"></div>
            <p style="margin-top: 1.25rem; text-align: center; font-size: 0.88rem; color: var(--text-muted);">
                لديك حساب مسبقاً؟ <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">تسجيل الدخول</a>
            </p>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;
            const btn = document.getElementById('regBtn');
            const msg = document.getElementById('regMsg');

            btn.disabled = true;
            btn.textContent = 'جاري الحفظ...';

            try {
                const res = await APIClient.request('auth.php?action=register', 'POST', { username, email, password, role });
                if (res.success) {
                    if (res.data && res.data.token) {
                        APIClient.setToken(res.data.token);
                        localStorage.setItem('user_data', JSON.stringify(res.data.user));
                    }
                    msg.innerHTML = `<span style="color: var(--success); font-weight: 700;">تم إنشاء الحساب بنجاح. جاري التوجيه...</span>`;
                    
                    const isManagement = (role === 'supervisor');
                    setTimeout(() => {
                        window.location.href = isManagement ? 'dashboard.html' : 'medicines.html';
                    }, 600);
                } else {
                    msg.innerHTML = `<span style="color: var(--danger); font-weight: 700;">${res.message || 'فشل إنشاء الحساب.'}</span>`;
                    btn.disabled = false;
                    btn.textContent = 'إنشاء الحساب';
                }
            } catch (err) {
                // Fallback mock register
                const mockUser = { id: Date.now(), username, email, role };
                APIClient.setToken('mock_jwt_token_registered');
                localStorage.setItem('user_data', JSON.stringify(mockUser));
                msg.innerHTML = `<span style="color: var(--success); font-weight: 700;">تم إنشاء الحساب بنجاح. جاري التوجيه...</span>`;
                setTimeout(() => {
                    window.location.href = (role === 'supervisor') ? 'dashboard.html' : 'order_create.html';
                }, 600);
            }
        }
    </script>
</body>
</html>
