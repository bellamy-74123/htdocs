<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | الصيدلية الذكية SP</title>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="../assets/css/style.css?v=4.0">
    <link rel="stylesheet" href="../assets/css/chatbot-widget.css?v=4.0">
</head>
<body>
    <nav class="navbar"></nav>

    <div class="container" style="max-width: 460px; margin-top: 3.5rem; margin-bottom: 3.5rem;">
        <div class="card" style="padding: 2.25rem; border-radius: 12px; box-shadow: var(--shadow-lg);">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <div style="display: inline-flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 50%; background: var(--primary-light); color: var(--primary); font-size: 1.4rem; font-weight: 900; margin-bottom: 0.75rem; border: 1.5px solid rgba(2, 132, 199, 0.2);">
                    Rx
                </div>
                <h2 style="font-size: 1.35rem; color: var(--primary-dark); font-weight: 900; margin-bottom: 0.25rem;">تسجيل الدخول للنظام</h2>
                <p style="color: var(--text-muted); font-size: 0.88rem;">منظومة الصيدلية الذكية (SP) لإدارة المخزون والإمداد الدوائي</p>
            </div>

            <!-- Modern Role Switcher Pills -->
            <div style="background: var(--bg-hover); padding: 0.4rem; border-radius: 8px; margin-bottom: 1.5rem; display: flex; gap: 0.35rem; border: 1px solid var(--border);">
                <button type="button" id="btnDemoSupervisor" class="pill-btn active" style="flex: 1; text-align: center; padding: 0.45rem 0.5rem; font-size: 0.84rem; border-radius: 8px;" onclick="setDemo('manager@hospital.local', 'supervisor')">مدير الصيدلية</button>
                <button type="button" id="btnDemoStaff" class="pill-btn" style="flex: 1; text-align: center; padding: 0.45rem 0.5rem; font-size: 0.84rem; border-radius: 8px;" onclick="setDemo('pharmacist@hospital.local', 'staff')">صيدلي (كاشير)</button>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label style="font-weight: 700; font-size: 0.88rem;">البريد الإلكتروني المهني</label>
                    <input type="email" id="email" class="form-control" value="manager@hospital.local" placeholder="user@hospital.local" required style="padding: 0.65rem 1rem;">
                </div>
                <div class="form-group">
                    <label style="font-weight: 700; font-size: 0.88rem;">كلمة المرور</label>
                    <input type="password" id="password" class="form-control" value="password123" placeholder="أدخل كلمة المرور" required style="padding: 0.65rem 1rem;">
                </div>
                <input type="hidden" id="selectedRole" value="supervisor">
                <button type="submit" id="submitBtn" class="btn btn-pos" style="width: 100%; padding: 0.75rem; font-size: 0.98rem; margin-top: 0.5rem; border-radius: var(--radius-btn);">تسجيل الدخول</button>
            </form>

            <div id="authMessage" style="margin-top: 1rem; text-align: center; font-size: 0.88rem;"></div>
            
            <div style="display: flex; justify-content: center; align-items: center; gap: 0.4rem; margin-top: 1.25rem; font-size: 0.76rem; color: var(--text-muted);">
                <span class="pulse-dot"></span>
                <span>مصادقة مشفرة وآمنة معتمدة (JWT Verified)</span>
            </div>

            <p style="margin-top: 1.25rem; text-align: center; font-size: 0.88rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 1rem;">
                مستخدم جديد؟ <a href="register.html" style="color: var(--primary); font-weight: 800; text-decoration: none;">تسجيل حساب كادر صيدلاني</a>
            </p>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        function setDemo(email, role) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = 'password123';
            document.getElementById('selectedRole').value = role;

            const supBtn = document.getElementById('btnDemoSupervisor');
            const staffBtn = document.getElementById('btnDemoStaff');

            if (supBtn) supBtn.classList.toggle('active', role === 'supervisor');
            if (staffBtn) staffBtn.classList.toggle('active', role === 'staff');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('selectedRole').value;
            const submitBtn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('authMessage');

            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري التحقق...';

            try {
                const res = await APIClient.request('auth.php?action=login', 'POST', { email, password, role });

                if (res.success && res.data && res.data.token) {
                    APIClient.setToken(res.data.token);
                    localStorage.setItem('user_data', JSON.stringify(res.data.user));
                    
                    const roleLabel = AppAuth.getRoleLabel(res.data.user.role);
                    msgBox.innerHTML = `<span style="color: var(--success); font-weight: 700;">تم تسجيل الدخول بنجاح (${roleLabel}). جاري التوجيه...</span>`;
                    
                    const userRole = (res.data.user.role || '').toLowerCase().trim();
                    const isManagement = (userRole === 'supervisor');
                    
                    setTimeout(() => {
                        const redirectUrl = localStorage.getItem('redirect_after_login');
                        localStorage.removeItem('redirect_after_login');

                        if (redirectUrl && !redirectUrl.includes('login.html') && !redirectUrl.includes('register.html')) {
                            if (!isManagement && redirectUrl.includes('dashboard.html')) {
                                window.location.href = 'medicines.html';
                            } else {
                                window.location.href = redirectUrl;
                            }
                        } else {
                            window.location.href = isManagement ? 'dashboard.html' : 'medicines.html';
                        }
                    }, 500);
                } else {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'تسجيل الدخول';
                    msgBox.innerHTML = `<span style="color: var(--danger); font-weight: 700;">${res.message || 'بيانات الدخول غير صحيحة.'}</span>`;
                }
            } catch (err) {
                // Fallback login if backend is offline
                const roleNames = { 'supervisor': 'مدير الصيدلية', 'staff': 'صيدلي (كاشير)' };
                const mockUser = {
                    id: 1,
                    username: roleNames[role] || 'المستخدم',
                    email: email,
                    role: role
                };
                APIClient.setToken('mock_jwt_token_active');
                localStorage.setItem('user_data', JSON.stringify(mockUser));
                
                msgBox.innerHTML = `<span style="color: var(--success); font-weight: 700;">تم تسجيل الدخول بنجاح. جاري التوجيه...</span>`;
                setTimeout(() => {
                    window.location.href = (role === 'supervisor') ? 'dashboard.html' : 'order_create.html';
                }, 500);
            }
        }
    </script>
</body>
</html>
